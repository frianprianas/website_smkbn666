version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smkbn666_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smkbn666
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: smkbn666_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/smkbn666
      - MAIL_HOST=mail.smk.baktinusantara666.sch.id
      - IMAP_PORT=993
      - SMTP_PORT=465
      - MAIL_SECURE=true
      - MAILCOW_API_URL=http://mail.smk.baktinusantara666.sch.id
      - MAILCOW_API_KEY=925B68-0FF6BB-36B760-F6C051-AAF343
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: smkbn666_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
