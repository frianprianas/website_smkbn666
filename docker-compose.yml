version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smkbn666_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: smkbn666
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: smkbn666_backend
    restart: always
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-password}@db:5432/smkbn666
      - MAIL_HOST=mail.smk.baktinusantara666.sch.id
      - IMAP_PORT=993
      - SMTP_PORT=465
      - MAIL_SECURE=true
      - MAILCOW_API_URL=http://mail.smk.baktinusantara666.sch.id
      - MAILCOW_API_KEY=925B68-0FF6BB-36B760-F6C051-AAF343
    depends_on:
      - db
    volumes:
      - ./backend/static:/app/static

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=https://smkbn666.sch.id
    container_name: smkbn666_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  whatsapp-gateway:
    build: ./whatsapp-gateway
    container_name: smkbn666_wa_gateway
    restart: always
    environment:
      - BACKEND_URL=http://backend:8000
      - AUTHORIZED_NUMBERS=${WA_AUTHORIZED_NUMBERS:-628123456789}
      - WA_USERNAME=${WA_ADMIN_USERNAME:-admin}
      - WA_PASSWORD=${WA_ADMIN_PASSWORD:-admin_password}
    depends_on:
      - backend
    volumes:
      - ./whatsapp-gateway/auth_info_baileys:/app/auth_info_baileys

volumes:
  postgres_data:
